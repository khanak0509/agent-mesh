[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-shared"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "psycopg2-binary>=2.9",
  "redis>=5.0",
  "aio-pika>=9.4",
  "pika>=1.3",
  "structlog>=24.1",
  "langchain>=0.3",
  "langchain-openai>=0.3",
  "langchain-core>=0.3",
  "langgraph>=0.2",
  "openai>=1.40",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_shared*"]
